<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ushizhimaの自己紹介</title>
  <style>
    /* ========================================
       ▼ 全体の基本設定・文字色の変更場所
    ======================================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      line-height: 1.7;
      color: #222222;            /* ← 基本の文字色（濃いグレー） */
      background-color: #ffffff; /* ← ページ全体の背景色（白） */
    }

    /* コンテンツの幅を制限し、広い画面でも狭い画面でもはみ出さない設定 */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    /* ヘッダー部分（白基調・下線で区切り） */
    header {
      background-color: #ffffff; /* ← ヘッダーの背景色（白） */
      color: #111111;            /* ← ヘッダー内の文字色 */
      padding: 28px 0 20px 0;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
    }

    header h1 {
      margin: 0 0 14px 0;
      font-size: 1.6rem;
      letter-spacing: 0.05em;
    }

    /* ページ内メニュー */
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap; /* 狭い画面で自動的に折り返す */
      gap: 16px;
    }

    nav a {
      color: #333333; /* ← メニューの文字色 */
      text-decoration: none;
      font-weight: bold;
      padding: 4px 8px;
      border-bottom: 2px solid transparent;
    }

    nav a:hover {
      border-bottom: 2px solid #222222;
    }

    /* メインコンテンツの各セクション */
    main {
      padding: 32px 0;
    }

    section {
      background-color: #ffffff;
      padding: 24px;
      margin-bottom: 24px;
      border-radius: 8px;
      border: 1px solid #e5e5e5; /* 白背景の中でカードが際立つ細い枠線 */
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #111111; /* ← 見出しの文字色 */
      border-bottom: 1px solid #dddddd;
      padding-bottom: 8px;
    }

    p {
      margin: 12px 0 0 0;
      overflow-wrap: break-word; /* 長いURLなどが横にはみ出るのを防ぐ */
    }

    /* 公式サイトへのリンク */
    .official-link {
      color: #0056b3; /* ← リンクの文字色（リンクと分かりやすい青） */
      font-weight: bold;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 16px 0 32px 0;
      font-size: 0.85rem;
      color: #666666; /* ← フッターの文字色 */
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <h1>Ushizhima</h1>
      <!-- ページ内メニュー -->
      <nav>
        <ul>
          <li><a href="#about">自己紹介</a></li>
          <li><a href="#learning">今学んでいること</a></li>
          <li><a href="#future">これからやってみたいこと</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- ① 自己紹介セクション -->
    <section id="about">
      <h2>自己紹介</h2>
      <!-- ▼ 自己紹介文を変える場所 -->
      <p>
        はじめまして、大学1年生のUshizhimaです。<br>
        高校時代は吹奏楽部に所属していました。どうぞよろしくお願いします！
      </p>
      <!-- ▼ 最近見たドラマと公式サイトのリンクを変える場所 -->
      <p>
        最近見たドラマ：<a href="https://www.tbs.co.jp/ryuseinokizuna/" class="official-link" target="_blank" rel="noopener noreferrer">公式サイトはこちら</a>
      </p>
    </section>

    <!-- ② 今学んでいることセクション -->
    <section id="learning">
      <h2>今学んでいること</h2>
      <!-- ▼ 今学んでいることの文章を変える場所 -->
      <p>
        現在は大学で情報系の勉強をしています。
      </p>
    </section>

    <!-- ③ これからやってみたいことセクション -->
    <section id="future">
      <h2>これからやってみたいこと</h2>
      <!-- ▼ これからやってみたいことの文章を変える場所 -->
      <p>
        魔法のような新体験をしてみたいです。
      </p>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; Ushizhima</p>
    </div>
  </footer>

</body>
</html>
